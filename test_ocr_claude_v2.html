<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test OCR Paspor — GohoTravel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 22px; font-weight: 700; color: #38bdf8; }
  .header p { font-size: 13px; color: #64748b; margin-top: 4px; }

  .card {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
    max-width: 680px; margin-left: auto; margin-right: auto;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: #94a3b8; margin-bottom: 14px;
  }

  .dropzone {
    border: 2px dashed #334155; border-radius: 10px;
    padding: 36px 20px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .dropzone:hover, .dropzone.dragover { border-color: #38bdf8; background: #0f2236; }
  .dropzone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dropzone .icon { font-size: 36px; margin-bottom: 8px; }
  .dropzone p { color: #64748b; font-size: 14px; }
  .dropzone span { color: #38bdf8; font-weight: 600; }

  #preview-wrap { display: none; margin-top: 14px; text-align: center; }
  #preview-img { max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid #334155; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none;
    transition: opacity 0.2s, transform 0.1s;
    width: 100%; justify-content: center; margin-top: 14px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #0ea5e9; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #38bdf8; }
  .btn-secondary { background: #1e3a4a; color: #38bdf8; border: 1px solid #0ea5e9; }

  #loading-wrap { display: none; text-align: center; margin-top: 16px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #334155;
    border-top-color: #38bdf8; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-label { font-size: 13px; color: #64748b; }

  #result-wrap { display: none; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 99px;
    margin-bottom: 14px; font-weight: 600;
  }
  .status-ok { background: #14532d33; color: #22c55e; border: 1px solid #22c55e55; }
  .status-warn { background: #78350f33; color: #fbbf24; border: 1px solid #fbbf2455; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .field-grid { grid-template-columns: 1fr; } }

  .field-item {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; padding: 10px 12px;
  }
  .field-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
  .field-value { font-size: 15px; font-weight: 600; color: #f1f5f9; word-break: break-all; }
  .field-value.empty { color: #475569; font-style: italic; font-weight: 400; font-size: 13px; }

  .copy-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .copy-btn {
    background: #1e3a4a; border: 1px solid #0ea5e9; color: #38bdf8;
    border-radius: 5px; padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .copy-btn:hover { background: #0ea5e9; color: #fff; }
  .copy-btn.copied { background: #14532d; border-color: #22c55e; color: #22c55e; }

  .divider { border: none; border-top: 1px solid #1e293b; margin: 14px 0; }

  #error-wrap { display: none; }
  .error-msg {
    background: #7f1d1d33; border: 1px solid #f8717155;
    border-radius: 8px; padding: 12px 14px; color: #f87171; font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🛂 Test OCR Paspor</h1>
  <p>GohoTravel · Claude Vision (Haiku) · Fase 5B</p>
</div>

<div class="card">
  <h2>📎 Upload Foto Paspor</h2>
  <div class="dropzone" id="dropzone">
    <input type="file" id="file-input" accept="image/*">
    <div class="icon">🖼️</div>
    <p>Drag & drop foto paspor, atau <span>klik untuk pilih file</span></p>
    <p style="margin-top:6px;font-size:12px;">JPG / PNG · Foto dari HP kualitas normal pun dicoba</p>
  </div>
  <div id="preview-wrap">
    <img id="preview-img" alt="Preview">
  </div>
  <div id="loading-wrap">
    <div class="spinner"></div>
    <div id="loading-label">Mengirim ke Claude Vision...</div>
  </div>
  <button class="btn btn-primary" id="btn-scan" disabled>🔍 Scan dengan Claude Vision</button>
</div>

<div class="card" id="error-wrap">
  <h2>❌ Error</h2>
  <div class="error-msg" id="error-msg"></div>
</div>

<div class="card" id="result-wrap">
  <h2>✅ Hasil Extract</h2>
  <div id="status-badge-wrap"></div>
  <div class="field-grid" id="field-grid"></div>
  <button class="btn btn-secondary" id="reset-btn" style="margin-top:14px;">🔄 Test Foto Lain</button>
</div>

<script>
  // ⚠️ Ganti dengan Apps Script URL kamu
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycdw7-YJaPY5J2varxb82LagiCKAlmDfkLOxCZZYEZwi5ZrpH9GLkZYFX-fg6se2t/exec';

  const fileInput = document.getElementById('file-input');
  const dropzone = document.getElementById('dropzone');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const btnScan = document.getElementById('btn-scan');
  const loadingWrap = document.getElementById('loading-wrap');
  const loadingLabel = document.getElementById('loading-label');
  const resultWrap = document.getElementById('result-wrap');
  const fieldGrid = document.getElementById('field-grid');
  const resetBtn = document.getElementById('reset-btn');
  const errorWrap = document.getElementById('error-wrap');
  const errorMsg = document.getElementById('error-msg');
  const statusBadgeWrap = document.getElementById('status-badge-wrap');

  let currentFile = null;

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = () => reject(new Error('Gagal baca file'));
      r.readAsDataURL(file);
    });
  }

  function showPreview(file) {
    currentFile = file;
    previewImg.src = URL.createObjectURL(file);
    previewWrap.style.display = 'block';
    btnScan.disabled = false;
    resultWrap.style.display = 'none';
    errorWrap.style.display = 'none';
  }

  fileInput.addEventListener('change', e => { if (e.target.files[0]) showPreview(e.target.files[0]); });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) showPreview(e.dataTransfer.files[0]);
  });

  function renderField(label, value) {
    const div = document.createElement('div');
    div.className = 'field-item';
    const isEmpty = !value || value === 'null' || value.trim() === '' || value === '-';
    div.innerHTML = `
      <div class="field-label">${label}</div>
      <div class="copy-row">
        <div class="field-value ${isEmpty ? 'empty' : ''}">${isEmpty ? '— tidak terbaca' : value}</div>
        ${!isEmpty ? `<button class="copy-btn">Salin</button>` : ''}
      </div>
    `;
    if (!isEmpty) {
      div.querySelector('.copy-btn').addEventListener('click', function() {
        navigator.clipboard.writeText(value).then(() => {
          this.textContent = '✓ Disalin';
          this.classList.add('copied');
          setTimeout(() => { this.textContent = 'Salin'; this.classList.remove('copied'); }, 1800);
        });
      });
    }
    return div;
  }

  btnScan.addEventListener('click', async () => {
    if (!currentFile) return;
    btnScan.disabled = true;
    loadingWrap.style.display = 'block';
    resultWrap.style.display = 'none';
    errorWrap.style.display = 'none';
    loadingLabel.textContent = 'Mengkonversi gambar...';

    try {
      const base64 = await fileToBase64(currentFile);
      const mediaType = currentFile.type || 'image/jpeg';

      loadingLabel.textContent = 'Mengirim ke Claude Vision...';

      // Kirim ke Apps Script sebagai proxy
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'ocrPaspor',
          base64Image: base64,
          mediaType: mediaType
        })
      });

      const result = await response.json();

      if (!result.success) throw new Error(result.error || 'Error dari Apps Script');

      const parsed = result.data;

      // Render fields
      fieldGrid.innerHTML = '';
      const fields = [
        ['Nama Lengkap', parsed.nama_lengkap],
        ['No Paspor', parsed.no_paspor],
        ['Tgl Lahir', parsed.tgl_lahir],
        ['Tgl Expired', parsed.tgl_expired],
        ['Nationality', parsed.nationality],
        ['Jenis Kelamin', parsed.jenis_kelamin],
        ['Tempat Lahir', parsed.tempat_lahir],
        ['Negara Penerbit', parsed.negara_penerbit],
      ];
      fields.forEach(([label, val]) => fieldGrid.appendChild(renderField(label, val ? String(val) : null)));

      // MRZ
      if (parsed.mrz_line1 || parsed.mrz_line2) {
        const mrzDiv = document.createElement('div');
        mrzDiv.style.cssText = 'grid-column:1/-1;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;';
        mrzDiv.innerHTML = `
          <div class="field-label">MRZ Raw</div>
          <div style="font-family:monospace;font-size:12px;color:#a3e635;margin-top:4px;letter-spacing:1px;word-break:break-all;">
            ${parsed.mrz_line1 || ''}<br>${parsed.mrz_line2 || ''}
          </div>
        `;
        fieldGrid.appendChild(mrzDiv);
      }

      // Catatan
      if (parsed.catatan) {
        const catatanDiv = document.createElement('div');
        catatanDiv.style.cssText = 'grid-column:1/-1;';
        catatanDiv.innerHTML = `
          <div style="font-size:12px;color:#fbbf24;background:#78350f22;border:1px solid #fbbf2433;border-radius:8px;padding:10px 12px;">
            💬 ${parsed.catatan}
          </div>
        `;
        fieldGrid.appendChild(catatanDiv);
      }

      // Status
      const filledCount = fields.filter(([, v]) => v && v !== 'null').length;
      statusBadgeWrap.innerHTML = filledCount >= 5
        ? `<span class="status-badge status-ok">✅ ${filledCount}/8 field terbaca</span>`
        : `<span class="status-badge status-warn">⚠️ Hanya ${filledCount}/8 field terbaca</span>`;

      loadingWrap.style.display = 'none';
      resultWrap.style.display = 'block';
      btnScan.disabled = false;

    } catch (err) {
      loadingWrap.style.display = 'none';
      errorWrap.style.display = 'block';
      errorMsg.textContent = err.message;
      btnScan.disabled = false;
    }
  });

  resetBtn.addEventListener('click', () => {
    currentFile = null;
    fileInput.value = '';
    previewWrap.style.display = 'none';
    previewImg.src = '';
    resultWrap.style.display = 'none';
    errorWrap.style.display = 'none';
    loadingWrap.style.display = 'none';
    btnScan.disabled = true;
  });
</script>
</body>
</html>
